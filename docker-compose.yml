services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meterly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meterly-dev-only}
      POSTGRES_DB: meterly
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterly -d meterly"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://meterly:${POSTGRES_PASSWORD:-meterly-dev-only}@db:5432/meterly
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-replace-me-with-a-long-random-secret}
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    stop_grace_period: 20s

volumes:
  pgdata:
